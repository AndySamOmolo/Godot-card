name: Build & Verify Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Validate Assets, Run Tests, Sign & Publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Ensure Build Tools 34
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Validate Tutorial Phases, Godot Docs & Glossary Cross-References
        run: |
          python3 - << 'PY'
          import json, glob, os
          phases = sorted(glob.glob("app/src/main/assets/tutorial/phase_*.json"))
          assert len(phases) >= 14, f"Expected >= 14 phases, found {len(phases)}"
          lesson_ids = set()
          for p in phases:
              with open(p, encoding="utf-8") as f:
                  d = json.load(f)
              assert len(d["lessons"]) > 0, f"Empty lessons in {p}"
              for l in d["lessons"]:
                  assert l["id"] not in lesson_ids, f"Duplicate lesson ID: {l['id']}"
                  lesson_ids.add(l["id"])
                  assert l.get("beyondKadi"), f"Missing beyondKadi in {l['id']}"
                  assert l.get("transferChallenge"), f"Missing transferChallenge in {l['id']}"
                  for q in l.get("quizQuestions", []):
                      assert 0 <= q["correctChoiceIndex"] < len(q["choices"]), f"Invalid quiz choice index in {q['id']}"
          docs = {os.path.basename(p)[:-3] for p in glob.glob("app/src/main/assets/godot_docs/*.md")}
          assert len(docs) >= 74, f"Expected >= 74 docs, found {len(docs)}"
          with open("app/src/main/assets/glossary/terms.json", encoding="utf-8") as f:
              g = json.load(f)
          for t in g["terms"]:
              for lid in t.get("relatedLessonIds", []):
                  assert lid in lesson_ids, f"Term {t['term']} references missing lesson {lid}"
              for cid in t.get("relatedDocClassNames", []):
                  assert cid in docs, f"Term {t['term']} references missing doc {cid}"
          print(f"Validated {len(phases)} phases ({len(lesson_ids)} lessons), {len(docs)} docs, and {len(g['terms'])} glossary terms.")
          PY

      - name: Run Unit Tests, Lint & Assemble Debug/Release APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Sign & Verify Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/kadi-companion-release.apk"
          trap 'rm -f /tmp/*.jks /tmp/app-release-aligned.apk' EXIT

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned release APK not found at $UNSIGNED_APK"
            exit 1
          fi

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Signing release APK with repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
            KS_PATH="/tmp/release.jks"
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          else
            echo "Repository signing secrets not configured — generating fallback release keystore (27+ year validity)."
            echo "Tip: Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD repository secrets to enable seamless in-place updates across builds."
            KS_PASS="$(openssl rand -hex 32)"
            K_ALIAS="kadi_release_fallback"
            K_PASS="$KS_PASS"
            keytool -genkeypair -v \
              -keystore /tmp/ci-release.jks \
              -alias "$K_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=Kadi Companion Release, OU=Mobile, O=Kadi, L=Nairobi, S=Nairobi, C=KE"
            KS_PATH="/tmp/ci-release.jks"
          fi

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/34.0.0"

          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$UNSIGNED_APK" /tmp/app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --ks-key-alias "$K_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            /tmp/app-release-aligned.apk

          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$SIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$SIGNED_APK"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$SIGNED_APK" | head -n 20

          mkdir -p dist-apks
          cp "$SIGNED_APK" dist-apks/kadi-companion-release.apk
          ls -lh dist-apks/

      - name: Publish Rolling GitHub Release (latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="dist-apks/kadi-companion-release.apk"
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          SHORT_SHA="${GITHUB_SHA::7}"

          gh release delete latest --yes --cleanup-tag || true

          gh release create latest "$APK_PATH" \
            --target "${{ github.sha }}" \
            --latest \
            --title "Kadi Companion — Latest Release APK" \
            --notes "$(cat <<EOF
          Rolling release build of **Kadi Companion** (\`kadi-companion-release.apk\`).

          - **Commit:** \`${{ github.sha }}\` (\`${SHORT_SHA}\`)
          - **Built:** ${BUILD_DATE}
          - **SHA-256:** \`${APK_SHA256}\`

          Download \`kadi-companion-release.apk\` directly from the assets below to install on Android 7.0+ (API 24+).
          EOF
          )"
